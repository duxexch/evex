# VEX Platform - Docker Compose Configuration
# منصة VEX للألعاب والتداول - تكوين Docker Compose
# آخر تحديث: يناير 2026

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vex_password}
      POSTGRES_DB: ${POSTGRES_DB:-vex_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - vex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vex_user} -d ${POSTGRES_DB:-vex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # VEX Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vex-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vex_user}:${POSTGRES_PASSWORD:-vex_password}@db:5432/${POSTGRES_DB:-vex_db}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ALLOW_FORCE_MIGRATIONS: ${ALLOW_FORCE_MIGRATIONS:-false}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      TZ: UTC
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - vex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Nginx Reverse Proxy (optional - use with: docker compose --profile with-nginx up)
  nginx:
    image: nginx:alpine
    container_name: vex-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - vex-network
    profiles:
      - with-nginx

networks:
  vex-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
